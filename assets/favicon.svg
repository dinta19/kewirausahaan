<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo SI Merch Telkom University Jakarta">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81E24" />
      <stop offset="100%" stop-color="#8B1217" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <!-- Topographic accent lines -->
  <path d="M8 48 C20 40, 28 54, 56 38" stroke="#FFF6EC" stroke-width="1.5" stroke-opacity="0.25" fill="none" stroke-linecap="round" />
  <path d="M8 54 C24 46, 34 58, 56 45" stroke="#FFF6EC" stroke-width="1.5" stroke-opacity="0.2" fill="none" stroke-linecap="round" />
  <!-- Carabiner Ring Icon + SI Monogram -->
  <rect x="21" y="10" width="22" height="10" rx="5" fill="none" stroke="#FFF6EC" stroke-width="3" />
  <text x="32" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">SI</text>
</svg>

